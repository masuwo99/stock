    (function setupIosZoomPrevention() {
      let lastTouchTime = 0;

      // ボタン連打時のダブルタップズームを完全にブロック
      document.addEventListener('touchend', function (e) {
        const btn = e.target.closest('button, .touch-manipulation, input[type="button"]');
        if (btn) {
          const now = Date.now();
          if (now - lastTouchTime <= 350) {
            e.preventDefault(); // Safariのズーム発火を防止
            btn.click(); // preventDefaultによるクリック抑止を回避して確実に発火
          }
          lastTouchTime = now;
        }
      }, { passive: false });

      // 操作系でのマルチタッチ・ピンチジェスチャーの抑止
      document.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1 && e.target.closest('button, input, select, .touch-manipulation')) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });
    })();

    // --- アプリ内 Pull-to-Refresh（下に引っ張って即時再同期） ---
    (function setupPullToRefresh() {
      let touchStartY = 0;
      let touchDiffY = 0;
      let isPulling = false;
      const pullIndicator = document.getElementById('pullIndicator');
      const pullIcon = document.getElementById('pullIcon');
      const pullText = document.getElementById('pullText');
      const threshold = 65;

      window.addEventListener('touchstart', (e) => {
        // 画面最上部スクロール時かつモーダルが開いていない場合のみ発火
        const anyModalOpen = document.querySelector('#itemModal:not(.hidden), #receiptModal:not(.hidden), #mealModal:not(.hidden), #shareModal:not(.hidden)');
        if (window.scrollY <= 2 && !anyModalOpen && e.touches.length === 1) {
          touchStartY = e.touches[0].clientY;
          isPulling = true;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isPulling) return;
        const currentY = e.touches[0].clientY;
        touchDiffY = currentY - touchStartY;

        if (touchDiffY > 15 && window.scrollY <= 2) {
          const move = Math.min(touchDiffY * 0.45, 70);
          if (pullIndicator) {
            pullIndicator.style.opacity = '1';
            pullIndicator.style.transform = `translateY(${move}px)`;
          }

          if (touchDiffY >= threshold) {
            if (pullIcon) pullIcon.style.transform = 'rotate(180deg)';
            if (pullText) pullText.textContent = '離して同期';
          } else {
            if (pullIcon) pullIcon.style.transform = 'rotate(0deg)';
            if (pullText) pullText.textContent = '引いて同期';
          }
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        if (!isPulling) return;
        isPulling = false;

        if (touchDiffY >= threshold && window.scrollY <= 2) {
          if (pullIcon) pullIcon.className = 'fa-solid fa-rotate animate-spin text-blue-500';
          if (pullText) pullText.textContent = '同期中...';

          // ルーム全体の最新ストックを即座にリクエスト
          triggerManualSync();

          setTimeout(() => {
            if (pullIndicator) {
              pullIndicator.style.opacity = '0';
              pullIndicator.style.transform = 'translateY(-48px)';
            }
            setTimeout(() => {
              if (pullIcon) {
                pullIcon.className = 'fa-solid fa-arrow-down text-blue-500';
                pullIcon.style.transform = 'rotate(0deg)';
              }
              if (pullText) pullText.textContent = '引いて同期';
            }, 250);
          }, 600);
        } else {
          if (pullIndicator) {
            pullIndicator.style.opacity = '0';
            pullIndicator.style.transform = 'translateY(-48px)';
          }
        }
        touchDiffY = 0;
      }, { passive: true });
    })();

    // --- HTTPS SSE リアルタイム同期エンジン（相互送受信の完全修復） ---
    function connectSyncEngine() {
      if (sseEventSource) {
        try { sseEventSource.close(); } catch(e){}
      }
      clearTimeout(sseReconnectTimer);

      const syncIndicator = document.getElementById('syncIndicator');
      const syncStatusText = document.getElementById('syncStatusText');

      // ntfy.sh の過去キャッシュ（直近1時間分）を取り込み、後から開いた端末も一発で同期
      const topicUrl = `https://ntfy.sh/${currentRoomId}/sse?since=1h`;

      try {
        sseEventSource = new EventSource(topicUrl);

        sseEventSource.onopen = () => {
          if (syncIndicator) syncIndicator.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
          if (syncStatusText) syncStatusText.textContent = '同期中';
          // 接続時に自端末のストックを他端末へ通知し、相手の最新状態を要求
          broadcastSyncEvent({ type: 'REQ_SYNC', sender: clientId });
        };

        sseEventSource.onmessage = (event) => {
          try {
            if (!event.data) return;
            const data = JSON.parse(event.data);
            
            // ntfyのイベントが message かつ本文が存在する場合のみ処理
            if (data.event !== 'message' || !data.message) return;

            let payload;
            try {
              payload = JSON.parse(data.message);
            } catch (err) {
              return;
            }

            // 自身が送信したイベントはスキップ
            if (payload.sender === clientId) return;

            handleIncomingSync(payload);
          } catch (e) {
            console.warn('SSE message error:', e);
          }
        };

        sseEventSource.onerror = () => {
          if (syncIndicator) syncIndicator.className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
          if (syncStatusText) syncStatusText.textContent = '再接続待機';
          
          try { sseEventSource.close(); } catch(e){}
          // 5秒後に自動再接続
          sseReconnectTimer = setTimeout(connectSyncEngine, 5000);
        };
      } catch (err) {
        if (syncIndicator) syncIndicator.className = 'w-2.5 h-2.5 rounded-full bg-slate-400';
        if (syncStatusText) syncStatusText.textContent = 'ローカル稼働';
      }
    }

    // イベントのブロードキャスト（ntfy.shの仕様に合わせてプレーンテキストで確実に送信）
    async function broadcastSyncEvent(action) {
      action.sender = clientId;
      action.timestamp = Date.now();

      try {
        // ntfy.sh/<topic> にPOSTボディを生文字列として渡すことで data.message にそのまま格納される
        await fetch(`https://ntfy.sh/${currentRoomId}`, {
          method: 'POST',
          body: JSON.stringify(action)
        });
      } catch (e) {
        console.warn('Sync broadcast failed:', e);
      }
    }

    // 最新の全ストック一覧を同室のメンバーへ確実にブロードキャスト
    function broadcastFullState() {
      broadcastSyncEvent({
        type: 'STATE_SNAPSHOT',
        items: items
      });
    }

    function triggerManualSync() {
      broadcastSyncEvent({ type: 'REQ_SYNC' });
      showToast('ストック同期を確認中...', 'info');
    }

    function queueSyncToast(label) {
      syncUpdateCount++;
      clearTimeout(syncNotificationTimer);
      syncNotificationTimer = setTimeout(() => {
        if (syncUpdateCount === 1) {
          showToast(label, 'info');
        } else if (syncUpdateCount > 1) {
          showToast(`${syncUpdateCount}件の変更を同期しました`, 'info');
        }
        syncUpdateCount = 0;
      }, 500);
    }

    function handleIncomingSync(payload) {
      switch (payload.type) {
        case 'REQ_SYNC':
          // 参加してきた家族へ現在の最新リストを返送
          if (items && items.length > 0) {
            broadcastFullState();
          }
          break;

        case 'STATE_SNAPSHOT':
        case 'RES_SYNC':
          if (Array.isArray(payload.items)) {
            // 受信した最新ストックリストで同期・反映
            items = payload.items;
            persistItemsLocally();
            render();
            queueSyncToast('最新ストックを受信しました');
          }
          break;

        case 'ITEM_ADDED':
          if (!items.some(i => i.id === payload.item.id)) {
            items.unshift(payload.item);
            persistItemsLocally();
            render();
            queueSyncToast(`追加: ${payload.item.name}`);
          }
          break;

        case 'ITEM_UPDATED':
          const idx = items.findIndex(i => i.id === payload.item.id);
          if (idx !== -1) {
            items[idx] = payload.item;
            persistItemsLocally();
            render();
            queueSyncToast(`更新: ${payload.item.name}`);
          }
          break;

        case 'ITEM_DELETED':
          items = items.filter(i => i.id !== payload.id);
          persistItemsLocally();
          render();
          queueSyncToast('食材を使い切りました');
          break;

        case 'BATCH_ADDED':
          if (Array.isArray(payload.newItems)) {
            items = [...payload.newItems, ...items];
            persistItemsLocally();
            render();
            queueSyncToast(`${payload.newItems.length}件の食材を追加`);
          }
          break;
      }
    }
